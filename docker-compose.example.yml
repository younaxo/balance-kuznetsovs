# Пример compose-файла для локальной разработки/staging на VPS.
# Скопируйте в docker-compose.yml, заполните .env реальными значениями
# (см. .env.example) и запустите:
#
#   docker compose up -d db
#   docker compose run --rm migrate
#   docker compose run --rm seed        # один раз, при первом запуске
#   docker compose up -d web
#
# PostgreSQL — persistent stateful-сервис. Web-контейнер — stateless,
# его можно пересоздавать/масштабировать без потери данных.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balance_kuznetsovs
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: ["npm", "run", "seed:admin"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
