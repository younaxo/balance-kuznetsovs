name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Тестовые значения, не production-секреты — реальные секреты (Telegram,
  # SMTP, боевой SESSION_SECRET) в CI не нужны и не хранятся в репозитории.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/balance_kuznetsovs_test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/balance_kuznetsovs_test
  SESSION_SECRET: ci-session-secret-not-used-in-production-0000000000
  ANALYTICS_IP_HASH_SALT: ci-salt-not-used-in-production

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: balance_kuznetsovs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "*.{ts,tsx,mjs}" "scripts/**/*.ts" "e2e/**/*.ts" "tests/**/*.ts"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (test DB)
        run: npm run db:migrate

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: balance_kuznetsovs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/balance_kuznetsovs
      ADMIN_EMAIL: admin@ci.local
      ADMIN_INITIAL_PASSWORD: CiOnlyPassword12345

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed admin user
        run: npm run seed:admin

      - name: Build
        run: npm run build

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
